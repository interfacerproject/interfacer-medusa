# Image: ghcr.io/interfacerproject/interfacer-medusa
#   master  -> :latest
#   staging -> :staging (the integration branch deployed on dpp-dev)
name: Create and publish a Docker image

on:
  push:
    branches: ["master", "staging"]
  workflow_dispatch:

jobs:
  publish_docker_image:
    uses: interfacerproject/workflows/.github/workflows/publish-ghcr.yml@main
    secrets: inherit
